; FreeType font configuration for Chinese (GBK) text.
;
; Copy this "fonts" directory into your Fallout 2 game directory (next to
; master.dat) and set language=chs in fallout2.cfg (see fonts/README.md).
; The bundled NotoSansSC.ttf covers Latin and CJK glyphs and works out of
; the box; drop in any other TrueType font and point "fileName" at it.
;
; Available keys per font (font0..font15, mapped to in-game fonts 100..115):
;   maxHeight     - glyph pixel size (vertical), required
;   maxWidth      - glyph pixel size (horizontal), defaults to maxHeight
;   lineSpacing   - extra pixels between lines, required
;   wordSpacing   - width of a space character, required
;   letterSpacing - extra pixels between characters, required
;   heightOffset  - extra pixels added to line height, required
;   warpMode      - 1 = wrap anywhere (CJK), 0 = prefer breaking at spaces
;   encoding      - text encoding of message files, required
;   fileName      - font file inside this directory, required
;
; Metrics follow the reference Chinese port (askme765cs/fallout2-ce-vita).

[font0]
maxHeight= 10
maxWidth= 10
lineSpacing=0
wordSpacing=4
letterSpacing=1
heightOffset=0
fileName=NotoSansSC.ttf
warpMode=0
encoding=GBK

; Main dialogue font. CJK text has no spaces, so it wraps per character.
[font1]
maxHeight= 12
maxWidth= 12
lineSpacing=1
wordSpacing=4
letterSpacing=1
heightOffset=1
fileName=NotoSansSC.ttf
warpMode=1
encoding=GBK

[font2]
maxHeight= 15
maxWidth= 15
lineSpacing=1
wordSpacing=3
letterSpacing=1
heightOffset=0
fileName=NotoSansSC.ttf
warpMode=0
encoding=GBK

[font3]
maxHeight= 15
maxWidth= 15
lineSpacing=1
wordSpacing=4
letterSpacing=1
heightOffset=0
fileName=NotoSansSC.ttf
warpMode=0
encoding=GBK

[font4]
maxHeight= 22
maxWidth= 22
lineSpacing=1
wordSpacing=12
letterSpacing=1
heightOffset=0
fileName=NotoSansSC.ttf
warpMode=0
encoding=GBK
